[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "governed-agent-core"
version = "0.1.0"
description = "Domain-free governed agent chassis: policy gate, orchestration, audit, auth scope, adversarial debate"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
