name: Enterprise Finance Agent

on:
  workflow_dispatch:
  push:
    paths:
      - "enterprise_finance_agent/**"
      - "governed_agent_core/**"
      - ".github/workflows/enterprise-finance-agent.yml"
  pull_request:
    paths:
      - "enterprise_finance_agent/**"
      - "governed_agent_core/**"
      - ".github/workflows/enterprise-finance-agent.yml"

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: governed_agent_core

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: governed_agent_core/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise_finance_agent

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: enterprise_finance_agent/pyproject.toml
      - name: Install
        run: python -m pip install -e "../governed_agent_core" -e ".[dev,runtime]"
      - name: Test
        run: pytest -q
      - name: Run deterministic CFO demo
        run: python examples/demo_cfo_pack.py > /dev/null
      - name: Import multi-agent team
        env:
          FINANCE_AGENT_MODEL: gpt-4o-mini
        run: python -c "import enterprise_finance_agent.agent_team"
