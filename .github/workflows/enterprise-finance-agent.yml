name: Enterprise Finance Agent

on:
  push:
    branches:
      - main
      - enterprise-finance-agent-foundation
    paths:
      - "enterprise_finance_agent/**"
      - ".github/workflows/enterprise-finance-agent.yml"
  pull_request:
    paths:
      - "enterprise_finance_agent/**"
      - ".github/workflows/enterprise-finance-agent.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise_finance_agent

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: enterprise_finance_agent/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev,runtime]"
      - name: Test
        run: pytest -q
      - name: Import multi-agent team
        env:
          FINANCE_AGENT_MODEL: gpt-4o-mini
        run: python -c "import enterprise_finance_agent.agent_team"
